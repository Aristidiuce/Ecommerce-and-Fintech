# ============================================================
#  KiliSmart — Nginx Configuration
#  File: /etc/nginx/sites-available/kilismart-test
#
#  This serves BOTH the frontend HTML files AND the Laravel API
#  on the same domain: test.kilismart.co.tz
#
#  Frontend: https://test.kilismart.co.tz/
#  API:      https://test.kilismart.co.tz/api/v1/
# ============================================================

server {
    listen 80;
    server_name test.kilismart.co.tz;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name test.kilismart.co.tz;

    # SSL — managed by Certbot (filled automatically)
    ssl_certificate     /etc/letsencrypt/live/test.kilismart.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.kilismart.co.tz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend static files root
    root /var/www/kilismart-frontend;
    index index.html;

    # ── API routes go to Laravel ──────────────────────────────
    location /api/ {
        root /var/www/kilismart-backend/public;
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        root /var/www/kilismart-backend/public;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # ── Laravel public folder (storage, etc.) ────────────────
    location /storage/ {
        alias /var/www/kilismart-backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Frontend routing ─────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ─────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Block hidden files ───────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/kilismart-test.access.log;
    error_log  /var/log/nginx/kilismart-test.error.log;

    # ── Upload size (for product images) ─────────────────────
    client_max_body_size 10M;
}
