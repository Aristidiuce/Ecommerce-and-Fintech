<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>KiliSmart — Ukurasa Haupatikani</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>:root{--g:#1a6b3c;--g2:#145530;--gold:#c9a84c;--cream:#f9f6f0;--border:#e5e7eb;--muted:#6b7280}*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;background:var(--cream);color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column}
nav{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--g);text-decoration:none}.logo span{color:var(--gold)}
.center{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.inner{max-width:480px}
.big-num{font-family:'Fraunces',serif;font-size:120px;font-weight:700;color:var(--g);line-height:1;opacity:.15;margin-bottom:-20px}
.icon{font-size:60px;margin-bottom:16px;display:block}
h1{font-family:'Fraunces',serif;font-size:28px;font-weight:700;margin-bottom:10px}
p{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:24px}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 24px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;transition:all .2s;border:none}
.btn-g{background:var(--g);color:#fff}
.btn-g:hover{background:var(--g2)}
.btn-out{background:none;border:1.5px solid var(--border);color:var(--muted)}
.btn-out:hover{border-color:var(--g);color:var(--g)}</style></head><body>
<nav><a href="index.html" class="logo">Kili<span>Smart</span></a></nav>
<div class="center"><div class="inner">
  <div class="big-num">404</div>
  <span class="icon">🏔️</span>
  <h1>Ukurasa huu haupatikani</h1>
  <p>Samahani! Ukurasa ulioutafuta haupo au umehama mahali pengine. Rudi nyumbani uendelee kutazama bidhaa zetu.</p>
  <div class="btn-row">
    <a href="index.html" class="btn btn-g">Rudi Nyumbani →</a>
    <a href="faq.html" class="btn btn-out">Maswali ya Kawaida</a>
  </div>
</div></div>
</body></html>
